version: '3.8'

services:
  redis-clone:
    build: .
    image: go-redis-clone:latest
    container_name: redis-standalone
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/app/redis.conf:ro
      - redis-data:/data
    command: ["--config", "/app/redis.conf", "--dir", "/data"]

volumes:
  redis-data: